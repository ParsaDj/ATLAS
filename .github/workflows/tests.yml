name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_POSTGRES_URL: postgresql+psycopg://atlas_test:atlas_test@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=sqlite:////tmp/atlas-migration-smoke.db alembic upgrade head
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dashboard
      - run: pnpm build
        working-directory: apps/dashboard
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: pnpm test:e2e
        working-directory: apps/dashboard
