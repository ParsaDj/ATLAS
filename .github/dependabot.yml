version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-python-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-dashboard-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
