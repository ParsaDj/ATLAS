version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-python-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # pydantic declares an exact core version; update the pair together.
      - dependency-name: pydantic-core
  - package-ecosystem: npm
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-dashboard-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
