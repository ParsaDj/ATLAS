services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - atlas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@db:5432/atlas
      ATLAS_BOOTSTRAP_ADMIN_USERNAME: atlas-admin
      ATLAS_BOOTSTRAP_ADMIN_PASSWORD: atlas-local-demo-password
      ATLAS_TELEMETRY_API_KEY: atlas-local-demo-bridge-key-123456
      ATLAS_INVESTIGATOR_MODE: ${ATLAS_INVESTIGATOR_MODE:-deterministic}
      ATLAS_LLM_API_KEY: ${ATLAS_LLM_API_KEY:-}
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-}
      ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-https://api.openai.com/v1}
      ATLAS_LLM_TIMEOUT_SECONDS: ${ATLAS_LLM_TIMEOUT_SECONDS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  simulator:
    build: .
    profiles: ["demo"]
    command: ["python", "-m", "simulator.fleet", "--url", "http://api:8000"]
    environment:
      ATLAS_OPERATOR_USERNAME: atlas-admin
      ATLAS_OPERATOR_PASSWORD: atlas-local-demo-password
      ATLAS_TELEMETRY_API_KEY: atlas-local-demo-bridge-key-123456
    depends_on:
      api:
        condition: service_healthy
  worker:
    build: .
    profiles: ["operations"]
    command: ["python", "-m", "simulator.worker", "--url", "http://api:8000"]
    environment:
      ATLAS_TELEMETRY_API_KEY: atlas-local-demo-bridge-key-123456
    depends_on:
      api:
        condition: service_healthy
volumes:
  atlas-data:
